# Platform publishing configuration
#
# Two types of publishers:
#   1. API-based: Use platform Open APIs (Dev.to, 掘金, Medium)
#   2. Browser-based: Use Playwright browser automation (CSDN, 微信公众号)
#
# IMPORTANT: Never commit real API keys to git.
# Use environment variables or a local .env file.

# ============================================================
# API-BASED PUBLISHERS
# ============================================================

juejin:
  enabled: false
  # access_token: "${JUEGIN_TOKEN}"  # Set via env var
  publish_as_draft: true  # Set to false to publish immediately

devto:
  enabled: true
  api_key: "${DEVTO_API_KEY}"  # Set via env var: export DEVTO_API_KEY="your_key"
  publish_as_draft: true

medium:
  enabled: false
  # integration_token: "${MEDIUM_TOKEN}"
  # author_id: ""

# ============================================================
# BROWSER-BASED PUBLISHERS (no API available)
# ============================================================
# These use Playwright browser automation. On first run, a
# browser window opens for manual login. Cookies are saved for
# subsequent headless runs.

csdn:
  enabled: false
  # CSDN Open API has been discontinued. Uses browser automation.
  # On first run, a browser will open for CSDN passport login.
  publish_as_draft: true        # Save as draft (safer for automation)
  headless: false                # Set to false to see the browser
  # cookie_dir: "data/cookies"  # Where login cookies are stored

wechat_mp:
  enabled: false
  # ★ 默认方式：浏览器自动化（推荐，无需固定 IP）
  #   首次运行需扫码登录，Cookie 保存后可 headless 运行
  headless: false               # 首次必须 false（看到二维码扫码），之后可改 true
  # cookie_dir: "data/cookies"
  # author: "Your Name"
  #
  # ★ 备选：官方草稿箱 API（需固定 IP 配白名单）
  #   启用方式：use_api: true + 配 app_id/app_secret
  #   WECHAT_APP_ID + WECHAT_APP_SECRET 环境变量
  # use_api: false

# ============================================================
# MANUAL / FUTURE PLATFORMS
# ============================================================

zhihu:
  enabled: false
  # 知乎: No public API for article publishing.
  # Option 1: Browser automation (similar to CSDN approach)
  # Option 2: Manual publish via zhuanlan.zhihu.com
